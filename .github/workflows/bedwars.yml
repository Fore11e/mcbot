# Holt alle 10 Minuten die offiziellen Spielerzahlen von der Hypixel-API
# und speichert sie in Firebase. Benoetigte GitHub-Secrets: HYPIXEL_KEY, FB_BASIS.
name: BedWars-Spielerzahlen
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Spielerzahlen holen und speichern
        env:
          FB_BASIS: ${{ secrets.FB_BASIS }}
          HYPIXEL_KEY: ${{ secrets.HYPIXEL_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${FB_BASIS:-}" ] || [ -z "${HYPIXEL_KEY:-}" ]; then echo 'Secret FB_BASIS oder HYPIXEL_KEY fehlt'; exit 1; fi
          FB="${FB_BASIS%/}/bedwars"
          code=$(curl -sS -H "API-Key: $HYPIXEL_KEY" -o d.json -w '%{http_code}' https://api.hypixel.net/v2/counts)
          echo "Hypixel -> HTTP $code"
          if [ "$code" != 200 ]; then head -c 300 d.json; echo; echo 'Tipp: Hypixel-Key abgelaufen? Neuen Key als Secret HYPIXEL_KEY eintragen.'; exit 1; fi
          T=$(date -u +%s)
          jq -c --argjson t "$T" '{t: ($t*1000), bw: .games.BEDWARS.players, total: .playerCount, modi: ((.games // {}) | map_values(.players // 0)), bwModi: (.games.BEDWARS.modes // {})}' d.json > live.json
          jq -c '[.games.BEDWARS.players, .playerCount]' d.json > p.json
          for z in "live live.json" "verlauf/$T p.json"; do
            set -- $z
            c=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$FB/$1.json" -d @"$2")
            echo "Speichere $1 -> HTTP $c"; [ "$c" = 200 ] || exit 1
          done
          echo "BedWars: $(jq .bw live.json), Hypixel gesamt: $(jq .total live.json)"
